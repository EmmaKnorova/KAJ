<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tune Piano - Songs</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/icon.png" alt="icon" style="width:42px;height:42px;">
        </div>
        <ul class="header-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="songs.html" class="active">Songs</a></li>
            <li><a href="#">Link 3</a></li>
        </ul>   
    </header>

    <main>
        <div class="songs-container">
            <h2>Select a Song to Play</h2>
            <p>Click on any song below to load it into the piano</p>
            
            <ul class="song-list">
                <li>
                    <button class="song-btn" data-notes="C1(1) C1(1) G1(1) G1(1) A1(1) A1(1) G1(2) F1(1) F1(1) E1(1) E1(1) D1(1) D1(1) C1(2)">Twinkle Twinkle Little Star</button>
                    <audio controls>
                        <source src="audios/twinkle.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </li>
                <li>
                    <button class="song-btn" data-notes="E1(1) E1(1) F1(1) G1(1) G1(1) F1(1) E1(1) D1(1) C1(1) C1(1) D1(1) E1(1) E1(1) D1(1) D1(2)">Ode to Joy</button>
                    <audio controls>
                        <source src="audios/odeToJoy.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </li>
                <li>
                    <button class="song-btn" data-notes="C1(1) C1(1) D1(2) C1(2) F1(2) E1(4) C1(1) C1(1) D1(2) C1(2) G1(2) F1(4)">Happy Birthday</button>
                    <audio controls>
                        <source src="audios/birthday.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </li>
                <li>
                    <button class="song-btn" data-notes="G1(1) G1(1) E1(2) G1(1) G1(1) E1(2) G1(1) G1(1) A1(1) G1(1) G1(2) F1(2)">Skákal pes přes oves</button>
                    <audio controls>
                        <source src="audios/skakalPes.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </li>
                <li>
                    <button class="song-btn" data-notes="G1(1) G1(1) A1(1) G1(1) G1(1) G1(1) A1(1) G1(1) G1(1) G1(1) A1(1) G1(1) G1(1) G1(1) A1(1) G1(1)">Prší, prší</button>
                    <audio controls>
                        <source src="audios/prsi.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </li>
                <li>
                    <button class="song-btn" data-notes="G1(1) G1(1) F1(1) F1(1) E1(1) E1(1) G1(2) D1(2) F1(2) E1(1) E1(1) G1(2) ">Komáři se ženili</button>
                    <audio controls>
                        <source src="audios/komari.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </li>
            </ul>
        </div>
    </main>

    <footer>
        <p>©Copyright 2026 by nobody. All rights reserved.</p>
    </footer>

    <script type="module" src="songs.js"></script>
</body>
</html>
